name: Server tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same ref supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run server test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Node 18 to match server/Dockerfile and the "engines": ">=18.0.0" field in
      # server/package.json. This replaces the old server.js.yml, which pinned
      # 12.16.x - contradicting the package's own declared requirement.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Run tests
        run: npm run test-text
        working-directory: ./server
