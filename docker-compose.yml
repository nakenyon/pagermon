# Duplicate a server+client block for each additional instance.
# Each instance needs a unique port, data directory, and (for the client)
# RTL_DEVICE index if multiple dongles are on the same host.
#
# Copy .env.example to .env and customize it - do not edit the defaults
# below in place, they exist only as a fallback.

services:

  # ── Instance 1 ──────────────────────────────────────────────────────────
  pagermon-server1:
    build: ./server
    image: pagermon-server
    container_name: pagermon-server1
    ports:
      - "${SERVER1_PORT:-3001}:3000"
    volumes:
      - ./data/server1:/data
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Chicago}
      # Docker sets HOSTNAME to the container ID by default, not a real
      # domain - set HOSTNAME1 in .env (see .env.example for details).
      - HOSTNAME=${HOSTNAME1:-}
      - USE_COOKIE_HOST=${USE_COOKIE_HOST1:-}
    restart: unless-stopped
    networks:
      - pagermon
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pagermon-client1:
    build: ./client
    image: pagermon-client
    container_name: pagermon-client1
    devices:
      - /dev/bus/usb:/dev/bus/usb   # pass through entire USB bus for RTL-SDR access
    volumes:
      - ./data/client1:/data
    environment:
      - PAGERMON_SERVER=http://pagermon-server1:3000
      - PAGERMON_API_KEY=${API_KEY1:-changeme}    # must match a key in server1's config.json
      - PAGERMON_IDENTIFIER=${CLIENT1_IDENTIFIER:-CLIENT1}
      # Not cosmetic: reader.js parses timestamps embedded in pager messages
      # with moment() in local time before converting to an epoch, so an unset
      # TZ (i.e. UTC) shifts those messages by your UTC offset.
      - TZ=${TZ:-America/Chicago}
      # -- rtl_fm --
      - RTL_FREQ=${RTL_FREQ1:-453.600M}     # -f  frequency to tune to
      - RTL_DEVICE=${RTL_DEVICE1:-0}        # -d  dongle index (0, 1, ...) or serial string
      - RTL_SQUELCH=${RTL_SQUELCH1:-0}      # -l  squelch level, 0 disables
      - RTL_GAIN=${RTL_GAIN1:-}             # -g  tuner gain in dB; unset = automatic gain
      - RTL_PPM=${RTL_PPM1:-}               # -p  ppm frequency correction; unset = 0
      - RTL_BIAS_TEE=${RTL_BIAS_TEE1:-}     # -T  enable bias-T power for powered antennas
      - RTL_FM_EXTRA_ARGS=${RTL_FM_EXTRA_ARGS1:-} # any extra rtl_fm flags, space-separated
      # -- multimon-ng --
      - MULTIMON_PROTOCOL=${MULTIMON_PROTOCOL1:-POCSAG1200} # -a  demodulator to enable
      - MULTIMON_B=${MULTIMON_B1:-2}               # -b  POCSAG BCH error-correction level, 0 disables
      - MULTIMON_INVERT=${MULTIMON_INVERT1:-}      # -i  invert input samples; try this if signal is present but nothing decodes
      - MULTIMON_HIDE_EMPTY=${MULTIMON_HIDE_EMPTY1:-} # -e  defaults to true (hide empty POCSAG messages)
      - MULTIMON_QUIET=${MULTIMON_QUIET1:-}        # -q  silence the startup banner/demodulator list
      - MULTIMON_VERBOSITY=${MULTIMON_VERBOSITY1:-} # -v  verbosity level, e.g. 1 for decode stats
      - MULTIMON_EXTRA_ARGS=${MULTIMON_EXTRA_ARGS1:-} # any extra multimon-ng flags, space-separated
    depends_on:
      pagermon-server1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagermon

  # ── Instance 2 ──────────────────────────────────────────────────────────
  pagermon-server2:
    build: ./server
    image: pagermon-server
    container_name: pagermon-server2
    ports:
      - "${SERVER2_PORT:-3002}:3000"
    volumes:
      - ./data/server2:/data
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Chicago}
      - HOSTNAME=${HOSTNAME2:-}
      - USE_COOKIE_HOST=${USE_COOKIE_HOST2:-}
    restart: unless-stopped
    networks:
      - pagermon
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pagermon-client2:
    build: ./client
    image: pagermon-client
    container_name: pagermon-client2
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data/client2:/data
    environment:
      - PAGERMON_SERVER=http://pagermon-server2:3000
      - PAGERMON_API_KEY=${API_KEY2:-changeme}
      - PAGERMON_IDENTIFIER=${CLIENT2_IDENTIFIER:-CLIENT2}
      - TZ=${TZ:-America/Chicago}
      # -- rtl_fm --
      - RTL_FREQ=${RTL_FREQ2:-462.950M}     # -f  frequency to tune to (different frequency for instance 2)
      - RTL_DEVICE=${RTL_DEVICE2:-1}        # -d  dongle index (0, 1, ...) or serial string (second dongle)
      - RTL_SQUELCH=${RTL_SQUELCH2:-0}      # -l  squelch level, 0 disables
      - RTL_GAIN=${RTL_GAIN2:-}             # -g  tuner gain in dB; unset = automatic gain
      - RTL_PPM=${RTL_PPM2:-}               # -p  ppm frequency correction; unset = 0
      - RTL_BIAS_TEE=${RTL_BIAS_TEE2:-}     # -T  enable bias-T power for powered antennas
      - RTL_FM_EXTRA_ARGS=${RTL_FM_EXTRA_ARGS2:-} # any extra rtl_fm flags, space-separated
      # -- multimon-ng --
      - MULTIMON_PROTOCOL=${MULTIMON_PROTOCOL2:-POCSAG1200} # -a  demodulator to enable
      - MULTIMON_B=${MULTIMON_B2:-2}               # -b  POCSAG BCH error-correction level, 0 disables
      - MULTIMON_INVERT=${MULTIMON_INVERT2:-}      # -i  invert input samples; try this if signal is present but nothing decodes
      - MULTIMON_HIDE_EMPTY=${MULTIMON_HIDE_EMPTY2:-} # -e  defaults to true (hide empty POCSAG messages)
      - MULTIMON_QUIET=${MULTIMON_QUIET2:-}        # -q  silence the startup banner/demodulator list
      - MULTIMON_VERBOSITY=${MULTIMON_VERBOSITY2:-} # -v  verbosity level, e.g. 1 for decode stats
      - MULTIMON_EXTRA_ARGS=${MULTIMON_EXTRA_ARGS2:-} # any extra multimon-ng flags, space-separated
    depends_on:
      pagermon-server2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagermon

networks:
  pagermon:
    driver: bridge
