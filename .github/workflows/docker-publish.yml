name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Escape hatch: path filtering below means a run triggered by an unrelated
  # change won't rebuild an image. Dispatch manually to force both.
  workflow_dispatch:

# Cancel a run that's been superseded by a newer push to the same ref (e.g.
# pushing several commits in quick succession). Keyed on ref rather than sha
# so that pushing a branch and a release tag for the same commit still
# produces both image tags - those are different artifacts, not duplicates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The server and client images are independent, but a push touching only one
  # of them used to rebuild both - and the client build cross-compiles for
  # arm64/armv7 under QEMU, which dominates the run time. Work out what
  # actually changed so each image only rebuilds when it needs to.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # need history back to the pre-push commit to diff against it
          fetch-depth: 0

      - name: Work out which images need rebuilding
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Diff explicitly against the commit this branch was on before the
          # push. Deliberately not using a paths-filter action here: they
          # default the comparison base to the repository's default branch,
          # which on a long-lived branch like main means diffing against
          # everything that has ever diverged from master - so every path
          # always looks changed and nothing is ever skipped.
          #
          # Anything that can't be diffed reliably (first push to a branch,
          # force-push, new tag, manual dispatch) falls back to building both
          # images, so the failure mode is a wasted build rather than a
          # silently missing one.
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable diff base (before='${BEFORE:-<unset>}') - building both images"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Narrow to files that can actually affect each image. Both
          # .dockerignore files exclude *.md, and server/.dockerignore also
          # excludes test/, so changes to those never reach the build context
          # and can only produce a byte-identical image. Without this a README
          # edit under client/ triggers a full 3-platform QEMU rebuild for
          # nothing.
          SERVER_CHANGED="$(echo "$CHANGED" | grep -E '^server/' | grep -vE '\.md$|^server/test/' || true)"
          CLIENT_CHANGED="$(echo "$CHANGED" | grep -E '^client/' | grep -vE '\.md$' || true)"

          server=false
          client=false
          if [ -n "$SERVER_CHANGED" ]; then server=true; fi
          if [ -n "$CLIENT_CHANGED" ]; then client=true; fi

          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "result: server=$server client=$client"

  build-server:
    name: Build and push server image
    runs-on: ubuntu-latest
    needs: changes
    # Tag pushes and manual dispatches always build both images, so a release
    # is never a partial set regardless of what the tagged commit touched.
    if: >-
      needs.changes.outputs.server == 'true'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Required for the arm64/armv7 cross-builds below - without these the
      # build silently produces an amd64-only image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # Match the client's platform set so a Raspberry Pi can run both
          # halves. The server compiles sqlite3 from source (musl has no
          # prebuilt binaries for it), so the arm legs are emulated compiles
          # and account for most of this job's run time.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-client:
    name: Build and push client image
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.client == 'true'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
