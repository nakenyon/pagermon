<div class="row" style="padding-top: 11px;">
</div>
<div ng-if="loading" class="loading"><i class="fa fa-spinner fa-spin"></i></div>
<div class="alert {{resetMessage.type}} alert-dismissable alert-fixed fade in" ng-if="resetMessage.show">
  <button type="button" class="close" data-dismiss="alert" aria-label="Close"
    ng-click="resetMessage.show = false">&times;</button>
  <strong>{{resetMessage.text}}</strong>
</div>
<div class="row" style="padding-top: 10px">
  <div class="col-xs-12">
    <h4 style="padding-left: 15px;">Change Password</h4>
    <hr />
    <div class="col-xs-12 col-md-offset-2 col-md-8">
      <form ng-submit="resetSubmit()" name="form">
        <!-- The server requires the current password: without it, anyone who
             gets hold of a live session could take the account permanently. -->
        <div class="form-group">
          <label for="currentpassword">Current Password:</label>
          <input type="password" class="form-control" id="currentpassword" name="currentpassword"
            ng-model="currentpassword" autocomplete="current-password" autofocus=true required>
        </div>
        <div class="form-group">
          <label for="password">New Password:</label>
          <input type="password" class="form-control" id="password" name="password" ng-model="password"
            autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm New Password:</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
            ng-model="confirm_password" autocomplete="new-password" required ui-validate=" '$value==password' "
            ui-validate-watch=" 'password' ">
          <span class="text-danger" ng-show='form.confirm_password.$error.validator'>Passwords do not match!</span>
        </div>
        <button ng-disabled="loading || form.confirm_password.$error.validator" type="submit"
          class="btn btn-default">Submit</button>
      </form>
      <p class="text-muted" style="margin-top: 15px;">
        Changing your password signs you out everywhere else.
      </p>
    </div>
  </div>
</div>
