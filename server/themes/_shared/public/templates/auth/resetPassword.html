<div class="row" style="padding-top: 11px;">
</div>
<div ng-if="loading" class="loading"><i class="fa fa-spinner fa-spin"></i></div>
<div class="alert {{resetMessage.type}} alert-dismissable alert-fixed fade in" ng-if="resetMessage.show">
  <button type="button" class="close" data-dismiss="alert" aria-label="Close"
    ng-click="resetMessage.show = false">&times;</button>
  <strong>{{resetMessage.text}}</strong>
</div>
<div class="row" style="padding-top: 10px">
  <div class="col-xs-12">
    <h4 style="padding-left: 15px;">Choose a New Password</h4>
    <hr />
    <div class="col-xs-12 col-md-offset-2 col-md-8">
      <form ng-submit="resetSubmit()" name="form" ng-if="!done">
        <!-- Bound through the `data` object, not bare primitives. The ng-if on
             this form creates a child scope, and writing to a bare primitive
             there shadows the controller's copy instead of updating it - the
             controller would always read undefined. -->
        <div class="form-group">
          <label for="password">New password:</label>
          <input type="password" class="form-control" id="password" name="password" ng-model="data.password"
            autofocus=true autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm new password:</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
            ng-model="data.confirm_password" autocomplete="new-password" required
            ui-validate=" '$value==data.password' " ui-validate-watch=" 'data.password' ">
          <span class="text-danger" ng-show='form.confirm_password.$error.validator'>Passwords do not match!</span>
        </div>
        <button ng-disabled="loading || form.confirm_password.$error.validator" type="submit"
          class="btn btn-default">Set password</button>
      </form>
      <div ng-if="done">
        <p>Your password has been changed. Taking you to the login page...</p>
      </div>
    </div>
  </div>
</div>
